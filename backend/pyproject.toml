[project]
name = "expense-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for the expense tracker app"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.32",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
